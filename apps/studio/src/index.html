<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Formly Studio | Visual ngx-formly Form Builder</title>
    <meta
      name="description"
      content="Build, preview, and export ngx-formly forms visually with Formly Studio, a visual authoring tool for Angular."
    />
    <meta
      name="theme-color"
      content="#3282b8"
    />
    <meta
      name="color-scheme"
      content="light dark"
    />

    <!-- Open Graph / Social Media Tags -->
    <meta
      property="og:type"
      content="website"
    />
    <meta
      property="og:title"
      content="Formly Studio | Visual ngx-formly Form Builder"
    />
    <meta
      property="og:description"
      content="Build, preview, and export ngx-formly forms visually with Formly Studio, a visual authoring tool for Angular."
    />
    <meta
      property="og:url"
      content="https://formlystudio.com/"
    />
    <meta
      property="og:site_name"
      content="Formly Studio"
    />

    <!-- Twitter Card Tags -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />
    <meta
      name="twitter:title"
      content="Formly Studio | Visual ngx-formly Form Builder"
    />
    <meta
      name="twitter:description"
      content="Build, preview, and export ngx-formly forms visually with Formly Studio, a visual authoring tool for Angular."
    />

    <!-- Keywords -->
    <meta
      name="keywords"
      content="angular forms, form builder, ngx-formly, Formly, visual form builder, FormlyFieldConfig, form editor, Angular development"
    />

    <!-- Robots and Crawling -->
    <meta
      name="robots"
      content="index, follow"
    />
    <meta
      name="googlebot"
      content="index, follow"
    />
    <meta
      name="revisit-after"
      content="7 days"
    />
    <meta
      name="author"
      content="Samuel Esan"
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://formlystudio.com/"
    />

    <!-- Base and Viewport -->
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes"
    />

    <!-- Icons -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16.png"
    />
    <link
      rel="manifest"
      href="/site.webmanifest"
    />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />

    <!-- Preconnect for Performance -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
